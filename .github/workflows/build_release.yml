name: Build Release

on:
  push:
    branches:
      - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant gradle permissions
        run: chmod +x ./gradlew

      - name: Test project
        run: ./gradlew test

      - name: Upload Test Results as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/test/

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }
        run: ./gradlew publish

      - name: Create a Release on GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}  # GitHub token for authentication
        run: |
          VERSION=$(./gradlew printVersion -q)
          TAG_NAME="v${VERSION}"
          RELEASE_NAME="${TAG_NAME}"
          BODY="Automated release of version ${VERSION}."
          
          # Create a new GitHub release via GitHub API
          curl -X POST https://api.github.com/repos/${{ github.repository }}/releases \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -d @- << EOF
          {
            "tag_name": "$TAG_NAME",
            "name": "$RELEASE_NAME",
            "body": "$BODY",
            "draft": false,
            "prerelease": false
          }
          EOF